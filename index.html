<DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Omaboryor Pageants 2026</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#080808;
    color:white;
}

header{
    text-align:center;
    padding:25px;
    border-bottom:2px solid gold;
}

header h1{
    color:gold;
}

.container{
    width:92%;
    max-width:1100px;
    margin:30px auto;
}

.contestants{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.card{
    background:#171717;
    border:1px solid #555;
    border-radius:12px;
    overflow:hidden;
    text-align:center;
    padding-bottom:20px;
}

.card img{
    width:100%;
    height:250px;
    object-fit:cover;
}

.card h2{
    color:gold;
}

.card button,
#payBtn{
    background:gold;
    border:none;
    padding:12px 25px;
    border-radius:6px;
    font-weight:bold;
    cursor:pointer;
}

#votingBox{
    display:none;
    max-width:500px;
    margin:35px auto;
    background:#171717;
    border:2px solid gold;
    border-radius:12px;
    padding:25px;
}

#votingBox h2{
    color:gold;
    text-align:center;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:5px;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #555;
    border-radius:6px;
    background:#222;
    color:white;
    box-sizing:border-box;
}

.coupons{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-top:10px;
}

.coupon{
    background:#222;
    color:white;
    border:1px solid gold;
    padding:15px;
    border-radius:6px;
    cursor:pointer;
}

.coupon.selected{
    background:gold;
    color:black;
}

#payBtn{
    width:100%;
    margin-top:20px;
}

#payBtn:disabled{
    opacity:.5;
}

#message{
    text-align:center;
    margin-top:15px;
    color:gold;
}

.close{
    background:#333;
    color:white;
    border:1px solid #777;
    padding:8px 15px;
    border-radius:5px;
}
</style>
</head>

<body>

<header>
    <h1>OMABORYOR PAGEANTS 2026</h1>
    <p>Vote for your favourite contestant</p>
</header>

<div class="container">

    <div class="contestants">

        <div class="card">
            <img src="best.jpeg">
            <h2>Contestant 01</h2>
            <p>Number: 001</p>
        <a href="https://paystack.shop/pay/wng-9y0ca1">
            <button>
                VOTE
            </button>
        </a>
        </div>

        <div class="card">
            <img src="ugly.jpeg">
            <h2>Contestant 02</h2>
            <p>Number: 002</p>
        <a href="https://paystack.shop/pay/wbmjatw1pm">
            <button>
                VOTE
            </button>
        </a>
        </div>

        <div class="card">
            <img src="ugliest.jpeg">
            <h2>Contestant 03</h2>
            <p>Number: 003</p>
        <a href="https://paystack.shop/pay/fl0js6whyx">
            <button>
                VOTE
            </button>
        </a>
        </div>

        <div class="card"> 
            <img src="ok.jpeg">
            <h2>Contestant 04</h2>
            <p>Number: 004</p>
        <a href="https://paystack.shop/pay/lbcf2zq1wg">
            <button>
                VOTE
            </button>
        </a>
        </div>

    </div>
</body>
</html>
